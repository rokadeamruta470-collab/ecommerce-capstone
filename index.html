<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Amruta Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Amruta Store</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#cart">Cart</a>
        </nav>
    </header>


    <main>

        <!-- Home Section -->
        <section id="home">

            <h2>Welcome to Amruta Store</h2>

            <p>
                Simple and modern e-commerce store.
            </p>

        </section>


        <!-- Products Section -->
        <section id="products">

            <h2>Product Catalog</h2>

            <div id="productContainer">

                <p>Products will appear here.</p>

            </div>

        </section>


        <!-- Cart Section -->
        <section id="cart">

            <h2>Shopping Cart</h2>

            <p>Your cart is empty.</p>

        </section>

    </main>


    <footer>

        <p>© 2026 Amruta Store</p>

    </footer>


    <!-- JavaScript -->
    <script src="app.js"></script>

</body>

</html>
