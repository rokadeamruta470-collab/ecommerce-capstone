<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Amruta Store</title>

    <link rel="stylesheet"
        href="style.css">

</head>


<body>

    <!-- Header -->
    <header>

        <h1>Amruta Store</h1>

        <nav>

            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#cart">Cart</a>
            <a href="#login">Login</a>
            <a href="#admin">Admin</a>

        </nav>

    </header>


    <main>


        <!-- Login Section -->
        <section id="login">

            <h2>Login</h2>

            <form id="loginForm">

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

        </section>


        <!-- Home Section -->
        <section id="home">

            <h2>
                Welcome to Amruta Store
            </h2>

            <p>
                Simple and modern e-commerce store.
            </p>

        </section>


        <!-- Products Section -->
        <section id="products">

            <h2>
                Product Catalog
            </h2>

            <div id="productContainer">

                <p>
                    Products will appear here.
                </p>

            </div>

        </section>


        <!-- Cart Section -->
        <section id="cart">

            <h2>
                Shopping Cart
            </h2>

            <div id="cartContainer">

                <p>
                    Your cart is empty.
                </p>

            </div>

            <h3 id="cartTotal">
                Total: $0.00
            </h3>

        </section>


        <!-- Admin CRUD Section -->
        <section id="admin">

            <h2>
                Product Management
            </h2>

            <form id="productForm">

                <input
                    type="text"
                    id="productTitle"
                    placeholder="Product name"
                    required
                >

                <input
                    type="number"
                    id="productPrice"
                    placeholder="Price"
                    required
                >

                <input
                    type="text"
                    id="productCategory"
                    placeholder="Category"
                    required
                >

                <input
                    type="text"
                    id="productImage"
                    placeholder="Image URL"
                    required
                >

                <button type="submit">
                    Add Product
                </button>

            </form>


            <h3>
                Manage Products
            </h3>

            <div id="adminProductContainer">
            </div>

        </section>


    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Amruta Store
        </p>

    </footer>


    <script src="app.js"></script>

</body>

</html>
